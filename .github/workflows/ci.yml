name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Black format check
        run: python -m black --check .

      - name: MyPy type check
        run: python -m mypy src

      - name: Tests pending project test runner
        run: |
          if [ ! -d tests ]; then
            echo "Expected tests/ scaffold is missing."
            exit 1
          fi

          echo "Test scaffold exists under tests/."
          echo "pytest is not a project dependency yet; validation gates still mark pytest as pending."
          echo "No test suite is executed by CI until pytest/test tooling is introduced."
