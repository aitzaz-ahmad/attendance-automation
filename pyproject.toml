[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "attendance-etl"
version = "0.1.0"
description = "Attendance ETL package"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "google-cloud-pubsub==1.1.0",
    "protobuf==3.11.2",
    "pyzk==0.9",
]

[project.optional-dependencies]
dev = [
    "black>=24.10.0",
    "mypy>=1.13.0,<1.15",
    "pre-commit>=4.0.0,<5",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["attendance_etl*"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.black]
line-length = 120
target-version = ["py38"]

[tool.mypy]
python_version = "3.8"
files = ["src/attendance_etl", "src/pi4"]
exclude = ["^src/backend/"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_configs = true

# Temporary baseline for migrated legacy code: keep MyPy focused on importability
# and name/type soundness without requiring annotations for every function yet.
disallow_untyped_defs = false
